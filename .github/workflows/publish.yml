name: Publish to PyPI
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stapel-core (main)
        run: pip install "stapel-core @ git+https://github.com/usestapel/stapel-core.git"

      # The VocabularyResolver protocol this module implements lands in
      # stapel-attributes 0.5.0. Installed from main here for the same reason
      # core is: the test job exercises the pair as it is being built, and the
      # release-track job below is the one that proves the declared pin
      # resolves from PyPI.
      - name: Install stapel-attributes (main)
        run: pip install --no-deps "stapel-attributes @ git+https://github.com/usestapel/stapel-attributes.git"

      - name: Install
        run: pip install -e ".[test]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_vocabularies; print('import OK')"

      - name: Install test dependencies
        run: pip install pytest pytest-django pytest-cov "jsonschema>=4" "stapel-tools>=0.9.1,<1"

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_vocabularies \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-vocabularies
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
